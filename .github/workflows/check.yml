name: Check
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rehab
          POSTGRES_PASSWORD: rehab
          POSTGRES_DB: rehab
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U rehab" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://rehab:rehab@localhost:55432/rehab
      CORS_ORIGINS: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx expo export --platform all
        working-directory: apps/mobile
      - run: docker build -t rehab-api:check .
